[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorysim"
version = "3.0.0"
description = "Factory simulator, messy source-system exports, and a DuckDB ETL + reconciliation pipeline scored against ground truth."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "duckdb>=1.3,<3",
    "pyarrow>=14",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
spark = ["pyspark==3.5.3"]

[project.scripts]
factorysim = "factorysim.cli:main"

[tool.setuptools.packages.find]
include = ["factorysim*"]

[tool.setuptools.package-data]
factorysim = ["sql/*.sql", "etl/sql/*/*.sql", "etl/reference/*.csv"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
